<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StyleShop - Storefront & Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 1. Replace with your Firebase project config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 2. Admin Email Set
    const ADMIN_EMAIL = "damerajona@gmail.com"; 

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const productsCol = collection(db, "products");

    const authSection = document.getElementById("auth-section");
    const appSection = document.getElementById("app-section");
    const adminPanel = document.getElementById("admin-panel");
    const customerStore = document.getElementById("customer-store");
    const userEmailDisplay = document.getElementById("user-email-display");
    const roleBadge = document.getElementById("role-badge");
    const authError = document.getElementById("auth-error");

    let isLoginMode = true;
    let currentUserIsAdmin = false;

    document.getElementById("toggle-auth-mode").addEventListener("click", () => {
      isLoginMode = !isLoginMode;
      document.getElementById("auth-title").textContent = isLoginMode ? "StyleShop Login" : "Create Account";
      document.getElementById("auth-submit-btn").textContent = isLoginMode ? "Login" : "Sign Up";
      document.getElementById("toggle-auth-mode").textContent = isLoginMode 
        ? "Don't have an account? Sign Up" 
        : "Already have an account? Login";
      authError.classList.add("hidden");
    });

    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      authError.classList.add("hidden");

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        authError.textContent = err.message;
        authError.classList.remove("hidden");
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authSection.classList.add("hidden");
        appSection.classList.remove("hidden");
        userEmailDisplay.textContent = user.email;

        if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          currentUserIsAdmin = true;
          adminPanel.classList.remove("hidden");
          customerStore.classList.add("hidden");
          roleBadge.textContent = "ADMIN";
          roleBadge.className = "px-2 py-0.5 text-xs font-bold bg-amber-500 text-black rounded";
        } else {
          currentUserIsAdmin = false;
          adminPanel.classList.add("hidden");
          customerStore.classList.remove("hidden");
          roleBadge.textContent = "CUSTOMER";
          roleBadge.className = "px-2 py-0.5 text-xs font-bold bg-emerald-600 text-white rounded";
        }
      } else {
        authSection.classList.remove("hidden");
        appSection.classList.add("hidden");
      }
    });

    document.getElementById("add-product-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUserIsAdmin) return;

      const name = document.getElementById("prod-name").value.trim();
      const category = document.getElementById("prod-category").value;
      const price = Number(document.getElementById("prod-price").value);
      const stock = Number(document.getElementById("prod-stock").value);
      const image = document.getElementById("prod-image").value.trim() || "https://via.placeholder.com/300x350?text=Dress";

      try {
        await addDoc(productsCol, {
          name,
          category,
          price,
          stock,
          image,
          createdAt: Date.now()
        });
        e.target.reset();
        alert("Item Added Successfully!");
      } catch (err) {
        alert("Error adding item: " + err.message);
      }
    });

    window.updateProductPrice = async (id, currentPrice) => {
      if (!currentUserIsAdmin) return;
      const newPrice = prompt("Enter new price (₹):", currentPrice);
      if (newPrice !== null && !isNaN(newPrice) && newPrice.trim() !== "") {
        await updateDoc(doc(db, "products", id), { price: Number(newPrice) });
      }
    };

    window.deleteProduct = async (id) => {
      if (!currentUserIsAdmin) return;
      if (confirm("Are you sure you want to delete this item?")) {
        await deleteDoc(doc(db, "products", id));
      }
    };
