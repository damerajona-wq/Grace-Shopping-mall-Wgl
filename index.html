<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Shopping Mall - Warangal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- FULL-SCREEN MANDATORY LOGIN GATE -->
    <div id="loginGate" class="fixed inset-0 z-50 bg-gradient-to-br from-blue-900 via-blue-800 to-gray-900 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-7 relative">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center space-x-2 mb-2">
                    <span class="text-3xl font-extrabold text-amber-500">GRACE</span>
                    <span class="text-xl font-bold text-blue-900">Shopping Mall WGL</span>
                </div>
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-800 mt-2">Welcome Back</h2>
                <p class="text-gray-500 text-sm mt-1">Login or create an account to access the store</p>
            </div>

            <div id="authAlert" class="hidden px-3 py-2 rounded-lg text-sm mb-4 font-medium"></div>

            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="emailInput" required placeholder="you@example.com" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="passwordInput" required minlength="6" placeholder="Minimum 6 characters" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <button type="submit" id="submitAuthBtn" class="w-full bg-blue-700 hover:bg-blue-800 active:scale-95 text-white font-semibold py-2.5 rounded-lg shadow transition cursor-pointer">
                    Login to Enter Store
                </button>
            </form>

            <div class="mt-4 text-center">
                <button type="button" id="toggleModeBtn" class="text-sm text-blue-700 hover:underline font-medium cursor-pointer">
                    Don't have an account? Sign Up
                </button>
            </div>

            <div class="relative my-5">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
                <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-gray-500">OR</span></div>
            </div>
