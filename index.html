<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashions Live Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-600">FASHIONS</h1>
            <div class="space-x-3">
                <button onclick="switchView('store')" id="btn-store" class="px-4 py-2 rounded-lg font-medium bg-indigo-600 text-white">Live Store</button>
                <button onclick="switchView('admin')" id="btn-admin" class="px-4 py-2 rounded-lg font-medium bg-gray-200 text-gray-700 hover:bg-gray-300">Admin Panel</button>
            </div>
        </div>
    </nav>

    <!-- CUSTOMER LIVE STORE VIEW -->
    <main id="store-view" class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-6">
            <h2 class="text-3xl font-bold text-gray-900">Latest Collection</h2>
            <p class="text-gray-500">Updates automatically in real-time.</p>
        </div>

        <!-- Dynamic Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-gray-500 col-span-full text-center py-10">Loading products...</p>
        </div>
    </main>

    <!-- ADMIN PANEL VIEW -->
    <section id="admin-view" class="max-w-4xl mx-auto px-4 py-8 hidden">
        
        <!-- Admin Login Box -->
        <div id="admin-login-box" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-center">Admin Login</h2>
            <p class="text-sm text-gray-500 mb-4 text-center">Sign in with your Firebase Email/Password account.</p>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="admin-email" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="admin@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="admin-password" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700">Login</button>
                <p id="login-error" class="text-red-500 text-sm text-center hidden"></p>
            </form>
        </div>

        <!-- Admin Dashboard (Shown after Login) -->
        <div id="admin-dashboard" class="hidden space-y-8">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
                <div>
                    <h2 class="text-xl font-bold">Store Manager</h2>
                    <p id="logged-in-user" class="text-sm text-gray-500"></p>
                </div>
                <button onclick="adminLogout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-600">Logout</button>
            </div>

            <!-- Add New Product Form -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h3 class="text-lg font-bold mb-4">Add New Product</h3>
                <form id="add-product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Product Name</label>
                        <input type="text" id="prod-name" required class="w-full border rounded-lg px-3 py-2" placeholder="e.g., Cotton Oversized T-Shirt">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Price (₹)</label>
                        <input type="number" id="prod-price" required class="w-full border rounded-lg px-3 py-2" placeholder="e.g., 799">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-1">Image URL</label>
                        <input type="url" id="prod-image" required class="w-full border rounded-lg px-3 py-2" placeholder="https://example.com/image.jpg">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-1">Description</label>
                        <textarea id="prod-desc" rows="2" class="w-full border rounded-lg px-3 py-2" placeholder="Short product details..."></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700">+ Publish to Live Store</button>
                    </div>
                </form>
            </div>

            <!-- Manage Existing Products -->
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h3 class="text-lg font-bold mb-4">Current Live Inventory</h3>
                <div id="admin-products-list" class="divide-y">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </section>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBc9W7sI52sN-vW-s348668167478", // Replace with exact full string if truncated
            authDomain: "fashions-86b7a.firebaseapp.com",
            projectId: "fashions-86b7a",
            storageBucket: "fashions-86b7a.firebasestorage.app",
            messagingSenderId: "348668167478",
            appId: "1:348668167478:web:ff69d1b976b79f0024a124",
            measurementId: "G-6Y7D71Y13H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const productsCol = collection(db, "products");

        // --- REAL-TIME LISTENER (Updates Store & Admin Instantly) ---
        const q = query(productsCol, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const storeGrid = document.getElementById("products-grid");
            const adminList = document.getElementById("admin-products-list");
            
            storeGrid.innerHTML = "";
            adminList.innerHTML = "";

            if (snapshot.empty) {
                storeGrid.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">No products available yet. Add some from the Admin Panel!</p>`;
                adminList.innerHTML = `<p class="text-gray-500 py-4">No products added yet.</p>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const id = docSnap.id;

                // 1. Render Customer Store Card
                storeGrid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-56 object-cover bg-gray-100" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
                        <div class="p-4">
                            <h3 class="font-bold text-lg text-gray-900 truncate">${item.name}</h3>
                            <p class="text-gray-500 text-sm mt-1 line-clamp-2">${item.description || ''}</p>
                            <div class="mt-4 flex justify-between items-center">
                                <span class="text-xl font-bold text-indigo-600">₹${item.price}</span>
                                <a href="https://wa.me/?text=Hi! I want to order: ${encodeURIComponent(item.name)} (₹${item.price})" target="_blank" class="bg-green-500 text-white text-sm px-3 py-1.5 rounded-lg font-medium hover:bg-green-600">Order</a>
                            </div>
                        </div>
                    </div>
                `;

                // 2. Render Admin Inventory Row
                adminList.innerHTML += `
                    <div class="py-3 flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <img src="${item.image}" class="w-12 h-12 rounded object-cover bg-gray-100">
                            <div>
                                <p class="font-semibold">${item.name}</p>
                                <p class="text-sm text-gray-500">₹${item.price}</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${id}')" class="text-red-600 hover:text-red-800 text-sm font-medium px-3 py-1 border border-red-200 rounded-lg">Delete</button>
                    </div>
                `;
            });
        });

        // --- ADMIN AUTHENTICATION ---
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("admin-email").value;
            const password = document.getElementById("admin-password").value;
            const errorEl = document.getElementById("login-error");

            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorEl.classList.add("hidden");
            } catch (err) {
                errorEl.textContent = "Login failed: " + err.message;
                errorEl.classList.remove("hidden");
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("admin-login-box").classList.add("hidden");
                document.getElementById("admin-dashboard").classList.remove("hidden");
                document.getElementById("logged-in-user").textContent = "Logged in as: " + user.email;
            } else {
                document.getElementById("admin-login-box").classList.remove("hidden");
                document.getElementById("admin-dashboard").classList.add("hidden");
            }
        });

        window.adminLogout = () => signOut(auth);

        // --- ADD & DELETE PRODUCTS ---
        document.getElementById("add-product-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("prod-name").value;
            const price = Number(document.getElementById("prod-price").value);
            const image = document.getElementById("prod-image").value;
            const description = document.getElementById("prod-desc").value;

            await addDoc(productsCol, {
                name,
                price,
                image,
                description,
                createdAt: serverTimestamp()
            });

            e.target.reset();
            alert("Product published to live store!");
        });

        window.deleteProduct = async (id) => {
            if (confirm("Remove this product from the live store?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        // --- VIEW SWITCHER ---
        window.switchView = (view) => {
            const storeView = document.getElementById("store-view");
            const adminView = document.getElementById("admin-view");
            const btnStore = document.getElementById("btn-store");
            const btnAdmin = document.getElementById("btn-admin");

            if (view === "store") {
                storeView.classList.remove("hidden");
                adminView.classList.add("hidden");
                btnStore.className = "px-4 py-2 rounded-lg font-medium bg-indigo-600 text-white";
                btnAdmin.className = "px-4 py-2 rounded-lg font-medium bg-gray-200 text-gray-700";
            } else {
                storeView.classList.add("hidden");
                adminView.classList.remove("hidden");
                btnAdmin.className = "px-4 py-2 rounded-lg font-medium bg-indigo-600 text-white";
                btnStore.className = "px-4 py-2 rounded-lg font-medium bg-gray-200 text-gray-700";
            }
        };
    </script>
</body>
</html>
