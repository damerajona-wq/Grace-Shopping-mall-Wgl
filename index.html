<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Shopping Mall - Warangal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-2">
                    <span class="text-2xl font-extrabold text-amber-500">GRACE</span>
                    <span class="text-lg font-bold text-blue-900">Shopping Mall WGL</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="userDisplay" class="hidden text-sm font-medium text-gray-700"></span>
                    <button id="openAuthBtn" onclick="toggleAuthModal(true)" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-4 py-2 rounded-lg shadow transition">
                        Login / Sign Up
                    </button>
                    <button id="logoutBtn" onclick="logoutUser()" class="hidden bg-red-500 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-lg shadow transition">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Banner -->
    <header class="bg-gradient-to-r from-blue-700 to-blue-900 text-white py-14 px-4 text-center shadow-inner">
        <h1 class="text-3xl sm:text-5xl font-bold mb-3">Welcome to Grace Shopping Mall</h1>
        <p class="text-blue-100 text-base sm:text-lg max-w-2xl mx-auto">
            Premium Ethnic & Casual Wear in Warangal. Browse our latest collection and order directly via WhatsApp.
        </p>
    </header>

    <!-- Main Catalog Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
            <h2 class="text-2xl font-bold text-gray-800">Latest Collection</h2>
            
            <!-- Category Filters -->
            <div class="flex flex-wrap gap-2 justify-center" id="categoryButtons">
                <button onclick="filterProducts('All', this)" class="filter-btn bg-blue-700 text-white px-4 py-1.5 rounded-full text-sm font-medium shadow">All</button>
                <button onclick="filterProducts('Ethnic Wear', this)" class="filter-btn bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 px-4 py-1.5 rounded-full text-sm font-medium">Ethnic Wear</button>
                <button onclick="filterProducts('Men\'s Fashion', this)" class="filter-btn bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 px-4 py-1.5 rounded-full text-sm font-medium">Men's Fashion</button>
                <button onclick="filterProducts('Women\'s Fashion', this)" class="filter-btn bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 px-4 py-1.5 rounded-full text-sm font-medium">Women's Fashion</button>
                <button onclick="filterProducts('Kids Wear', this)" class="filter-btn bg-white text-gray-700 border border-gray-300 hover:bg-gray-100 px-4 py-1.5 rounded-full text-sm font-medium">Kids Wear</button>
            </div>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Products will load here -->
        </div>
    </main>

    <!-- Auth Modal (Login / Sign Up Popup) -->
    <div id="authModal" class="fixed inset-0 z-50 hidden modal-backdrop flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative animate-fade-in">
            <button onclick="toggleAuthModal(false)" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-xl">
                <i class="fas fa-times"></i>
            </button>
            
            <h3 id="modalTitle" class="text-2xl font-bold text-center text-blue-900 mb-2">Welcome Back</h3>
            <p class="text-center text-gray-500 text-sm mb-6">Login or create an account to continue</p>

            <div id="authError" class="hidden bg-red-100 border border-red-400 text-red-700 px-3 py-2 rounded text-sm mb-4"></div>

            <!-- Email / Password Form -->
            <form id="authForm" onsubmit="handleEmailAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="emailInput" required placeholder="Enter your email" class="w-full px-3 py-2 border border-gray-3
